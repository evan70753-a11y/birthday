<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Cacut ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:
linear-gradient(
135deg,
#ff758c,
#ff7eb3,
#ffd3a5
);
min-height:100vh;
overflow-x:hidden;
padding:30px 15px;
}

.container{
max-width:900px;
margin:auto;
}

.card{
background:rgba(255,255,255,0.18);
backdrop-filter:blur(15px);
-webkit-backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,0.3);
border-radius:30px;
padding:35px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.15);
color:white;
}

h1{
font-size:3rem;
font-weight:700;
margin-bottom:10px;
}

h2{
font-weight:500;
margin-bottom:15px;
}

.subtitle{
font-size:18px;
opacity:.95;
}

button{
margin-top:25px;
padding:15px 35px;
border:none;
border-radius:50px;
background:white;
color:#ff4f8b;
font-size:18px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

#content{
display:none;
}

.slider{
width:340px;
height:440px;
margin:30px auto;
overflow:hidden;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.slider img{
width:100%;
height:100%;
object-fit:cover;
transition:1s;
}

#message{
font-size:20px;
line-height:1.9;
white-space:pre-line;
padding:10px;
}

.heart{
position:fixed;
font-size:24px;
pointer-events:none;
animation:fall linear forwards;
z-index:999;
}

@keyframes fall{

0%{
transform:translateY(-100px);
opacity:1;
}

100%{
transform:translateY(110vh);
opacity:0;
}

}

.footer{
margin-top:30px;
font-size:14px;
opacity:.8;
}

@media(max-width:600px){

h1{
font-size:2.2rem;
}

.slider{
width:280px;
height:360px;
}

#message{
font-size:17px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="card" id="cover">

<h1>🎂 Happy Birthday 🎂</h1>

<h2>Cacut ❤️</h2>

<p class="subtitle">
Hari ini ada hadiah kecil yang menunggumu ✨
</p>

<button onclick="openGift()">
🎁 Buka Hadiah
</button>

</div>

<div class="card" id="content">

<h1>Happy Birthday Cacut ❤️</h1>

<div class="slider">
<img id="slide" src="caca1.jpeg">
</div>

<div id="message"></div>

<div class="footer">
Made with ❤️
</div>

</div>

</div>

<audio id="music">
<source src="serta-mulia.mpeg" type="audio/mpeg">
</audio>

<script>

const photos=[
"caca1.jpeg",
"caca2.jpeg",
"caca3.jpeg"
];

let current=0;

setInterval(()=>{

const slide=document.getElementById("slide");

if(slide){

current=(current+1)%photos.length;
slide.src=photos[current];

}

},3000);

const text=`

Selamat ulang tahun, Cacut ✨

Semoga di usia yang baru ini,
kamu selalu diberikan kesehatan,
kebahagiaan, dan banyak alasan untuk tersenyum.

Semoga semua hal baik yang kamu usahakan
dapat menemukan jalannya untuk menjadi kenyataan.

Terima kasih sudah menjadi pribadi
yang membawa warna indah
bagi orang-orang di sekitarmu.

Semoga hari-harimu dipenuhi tawa,
langkahmu dipenuhi keberanian,
dan mimpimu dipenuhi harapan yang terus tumbuh.

Hari ini adalah harimu.

Nikmati setiap momennya,
tertawa lebih banyak,
dan jangan lupa untuk selalu menghargai
dirimu sendiri.

Karena kamu pantas mendapatkan
banyak kebahagiaan.

Happy Birthday Cacut ❤️🎂✨

`;

function typeWriter(){

let i=0;

function typing(){

if(i<text.length){

document.getElementById("message").innerHTML+=text.charAt(i);

i++;

setTimeout(typing,35);

}

}

typing();

}

function openGift(){

document.getElementById("cover").style.display="none";

document.getElementById("content").style.display="block";

const music=document.getElementById("music");

music.play();

confetti({
particleCount:250,
spread:180,
origin:{y:0.6}
});

typeWriter();

setInterval(createHeart,250);

}

function createHeart(){

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.animationDuration=
(3+Math.random()*4)+"s";

document.body.appendChild(heart);

setTimeout(()=>{

heart.remove();

},7000);

}

</script>

</body>
</html>
