<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    font-family:Arial,sans-serif;
}

.card{
    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;
    width:350px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

button{
    padding:10px 20px;
    border:none;
    border-radius:10px;
    background:#ff4081;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="card">
    <h1>🎉 Happy Birthday 🎉</h1>
    <h2>Nama Dia</h2>

    <p>
        Semoga panjang umur, sehat selalu,
        dan semua impianmu tercapai ❤️
    </p>

    <button onclick="ucapan()">
        Klik Aku
    </button>
</div>

<script>
function ucapan(){
    alert("Selamat ulang tahun, semoga hari ini penuh kebahagiaan ❤️");
}
</script>

</body>
</html>
